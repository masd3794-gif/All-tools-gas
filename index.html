<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Tools — Semua Alat dalam Satu Tempat</title>
<meta name="description" content="All Tools: downloader, QR code, konverter, kalkulator, dan berbagai utilitas harian dalam satu website cepat dan ringan.">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ TOP NAVBAR ============ -->
<header class="navbar">
  <button class="icon-btn only-desktop" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="brand" data-route="home">
    <span class="brand-mark">AT</span>
    <span class="brand-name">All Tools</span>
  </div>
  <div class="navbar-search only-desktop">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="navSearchInput" type="text" placeholder="Cari tool… (contoh: QR, downloader, kalkulator)" autocomplete="off">
  </div>
  <div class="navbar-actions">
    <button class="icon-btn" id="themeToggle" aria-label="Ganti tema">
      <svg id="themeIconSun" width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg id="themeIconMoon" width="19" height="19" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<!-- ============ DESKTOP SIDEBAR ============ -->
<aside class="sidebar only-desktop" id="sidebar">
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <span>All Tools v1.0.0</span>
  </div>
</aside>

<!-- ============ MAIN CONTENT ============ -->
<main id="app" class="app-main"></main>

<!-- ============ MOBILE BOTTOM NAV ============ -->
<nav class="bottom-nav only-mobile" id="bottomNav"></nav>

<!-- ============ TOAST CONTAINER ============ -->
<div class="toast-container" id="toastContainer"></div>

<!-- Templates -->
<template id="tpl-tool-card">
  <button class="tool-card" type="button">
    <span class="tool-card-icon"></span>
    <span class="tool-card-name"></span>
    <span class="tool-card-fav" title="Favoritkan">☆</span>
  </button>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="js/app.js"></script>
</body>
</html>
